# CERULION VENDORED FORK of re_grpc_server 0.34.1 (CER-858).
#
# This is upstream re_grpc_server 0.34.1 (rerun-io/rerun) + ONE localized patch:
# a `ServerOptions::drop_temporal_history` mode that makes the per-client
# connect-history retain the scene skeleton (persistent + static_) but NEVER
# buffer disposable/temporal frames — Cerulion Studio's instant-only live viz
# (no catch-up replay, no accumulation, no viewer-blueprint clobber). See
# CERULION-PATCH.md for the exact delta.
#
# Pinned into the workspace via the root Cargo.toml `[patch.crates-io]` (the
# rustdds-fork precedent). Version stays 0.34.1 so it satisfies the whole re_*
# graph's `=0.34.1` requirements (one version — `cargo tree | grep re_grpc`).
# Packaging-only fields from the published Cargo.toml (`include`, `readme`,
# `publish`, `repository`, `homepage`, docs.rs metadata) are dropped — a local
# path patch is never published.
[package]
edition = "2024"
rust-version = "1.92"
name = "re_grpc_server"
version = "0.34.1"
authors = ["rerun.io <opensource@rerun.io>"]
description = "Server for the legacy StoreHub API (Cerulion vendored fork, CER-858)"
license = "MIT OR Apache-2.0"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
resolver = "2"

[lib]
name = "re_grpc_server"
path = "src/lib.rs"

[[bin]]
name = "re_grpc_server"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false }
async-stream = "0.3.6"
futures = "0.3.32"
itertools = "0.14.0"
parking_lot = { version = "0.12.5", features = ["serde"] }
re_byte_size = { version = "0.34.1", default-features = false }
re_chunk = { version = "0.34.1", default-features = false }
re_error = { version = "0.34.1", default-features = false }
re_format = { version = "0.34.1", default-features = false }
re_log = { version = "0.34.1", features = ["setup"], default-features = false }
re_log_channel = { version = "0.34.1", default-features = false }
re_log_encoding = { version = "0.34.1", features = [
    "encoder",
    "decoder",
], default-features = false }
re_log_types = { version = "0.34.1", default-features = false }
re_memory = { version = "0.34.1", default-features = false }
re_protos = { version = "0.34.1", default-features = false }
re_quota_channel = { version = "0.34.1", features = ["tokio"], default-features = false }
re_sdk_types = { version = "0.34.1", default-features = false }
re_sorbet = { version = "0.34.1", default-features = false }
re_tracing = { version = "0.34.1", default-features = false }
re_uri = { version = "0.34.1", default-features = false }
tonic = { version = "0.14.6", features = ["transport", "router"], default-features = false }
tonic-web = "0.14.6"
tower-http = { version = "0.6.11", features = ["cors"] }
wildmatch = "2.6"

[dev-dependencies]
similar-asserts = "1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.52", default-features = false }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = { version = "0.7.18", default-features = false }

